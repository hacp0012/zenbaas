<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="cotton-cloud">
    <feTurbulence type="fractalNoise" baseFrequency="0.011" numOctaves="3" seed="7" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.52  0 0 0 0 0.45  0 0 0 0 0.36  0 0 0 0.032 0"/>
  </filter>
  <filter id="cotton-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.92" numOctaves="2" seed="19" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.44  0 0 0 0 0.38  0 0 0 0 0.30  0 0 0 0.036 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#cotton-cloud)"/>
  <rect width="360" height="360" filter="url(#cotton-grain)"/>
  <g stroke="rgba(110,92,72,0.045)" stroke-width="0.6" stroke-linecap="round">
    <line x1="22" y1="48" x2="34" y2="51"/>
    <line x1="142" y1="18" x2="155" y2="15"/>
    <line x1="268" y1="84" x2="279" y2="88"/>
    <line x1="76" y1="164" x2="88" y2="160"/>
    <line x1="196" y1="212" x2="209" y2="215"/>
    <line x1="312" y1="264" x2="324" y2="260"/>
    <line x1="48" y1="310" x2="60" y2="314"/>
    <line x1="224" y1="332" x2="237" y2="329"/>
  </g>
</svg>
