<svg xmlns="http://www.w3.org/2000/svg" width="360" height="360" viewBox="0 0 360 360">
  <filter id="felt-cloud">
    <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="3" seed="11" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.46  0 0 0 0 0.39  0 0 0 0 0.31  0 0 0 0.048 0"/>
  </filter>
  <filter id="felt-grain">
    <feTurbulence type="fractalNoise" baseFrequency="0.88" numOctaves="2" seed="29" stitchTiles="stitch"/>
    <feColorMatrix type="matrix" values="0 0 0 0 0.38  0 0 0 0 0.32  0 0 0 0 0.25  0 0 0 0.042 0"/>
  </filter>
  <rect width="360" height="360" filter="url(#felt-cloud)"/>
  <rect width="360" height="360" filter="url(#felt-grain)"/>
  <g stroke="rgba(96,80,62,0.055)" stroke-width="0.7" stroke-linecap="round">
    <line x1="34" y1="28" x2="49" y2="32"/>
    <line x1="168" y1="74" x2="181" y2="70"/>
    <line x1="286" y1="132" x2="299" y2="137"/>
    <line x1="92" y1="218" x2="106" y2="213"/>
    <line x1="234" y1="286" x2="248" y2="290"/>
    <line x1="42" y1="334" x2="55" y2="330"/>
  </g>
</svg>
